<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT 每日晨报</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2533; --muted:#6b7280;
    --line:#e7eaf2; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* HERO */
  .hero{
    background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#9333ea 100%);
    color:#fff; padding:46px 22px 38px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::after{content:"";position:absolute;inset:0;background:
    radial-gradient(600px 200px at 15% -10%,rgba(255,255,255,.18),transparent),
    radial-gradient(500px 220px at 90% 0%,rgba(255,255,255,.12),transparent);pointer-events:none}
  .kicker{font-size:13px;letter-spacing:.28em;text-transform:uppercase;opacity:.85;font-weight:600}
  .hero h1{font-size:clamp(26px,5vw,40px);margin:10px 0 6px;font-weight:800;letter-spacing:.5px}
  .hero .meta{font-size:13px;opacity:.9;max-width:680px;margin:0 auto}
  .hero .total{margin:18px 0 22px;font-size:15px}
  .hero .total b{font-size:30px;font-weight:800;vertical-align:-2px;margin:0 6px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:760px;margin:0 auto}
  .stat{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(6px);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:7px;
  }
  .stat .dot{width:9px;height:9px;border-radius:50%}
  .stat b{font-size:15px}

  /* OVERVIEW (今日要点) */
  .overview{max-width:1080px;margin:22px auto 0;padding:0 18px}
  .overview .box{
    background:linear-gradient(180deg,#ffffff,#fbfcff);
    border:1px solid var(--line);border-left:4px solid #7c3aed;
    border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);
  }
  .overview .o-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .overview .o-head .tag{
    font-size:11px;font-weight:700;color:#7c3aed;background:#f1ecfe;
    border-radius:6px;padding:2px 9px;letter-spacing:.04em;
  }
  .overview .o-head h2{font-size:16px;font-weight:800;color:var(--ink)}
  /* 今日导语（一句话主线） */
  .overview .takeaway{
    font-size:15.5px;font-weight:700;color:#1f2533;line-height:1.6;
    margin:2px 0 14px;padding:11px 14px;background:#f5f3ff;
    border-radius:10px;border-left:3px solid #7c3aed;
  }
  /* 今日要点：分块 + 加粗标题，便于扫读 */
  .ov-block{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .ov-block:first-of-type{border-top:none}
  .ov-block-label{
    flex:0 0 60px;font-size:12.5px;font-weight:800;color:var(--c);
    position:relative;padding-left:11px;line-height:1.5;
  }
  .ov-block-label::before{
    content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;
    border-radius:2px;background:var(--c);
  }
  .ov-list{list-style:none;flex:1}
  .ov-list li{margin-bottom:9px;line-height:1.66}
  .ov-list li:last-child{margin-bottom:0}
  .ov-t{font-size:14px;font-weight:700;color:#1f2533}
  .ov-s{font-size:13.5px;color:#4b5563;margin-left:1px}
  @media (max-width:520px){
    .overview{padding:0 12px}
    .ov-block{flex-direction:column;gap:3px}
    .ov-block-label{flex:none}
  }

  /* NAV */
  .nav{
    position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 14px;
  }
  .nav a{
    text-decoration:none;font-size:13px;color:var(--ink);font-weight:600;
    padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;transition:.15s;
    border:1px solid transparent;
  }
  .nav a:hover{background:#eef1fb;border-color:#d9defb}
  .nav a.top{background:#1f2533;color:#fff}
  .nav a b{font-size:12px;background:rgba(0,0,0,.07);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
  .nav a.top b{background:rgba(255,255,255,.25)}

  /* SECTIONS */
  .wrap{max-width:1080px;margin:0 auto;padding:30px 18px 10px}
  section{margin-bottom:38px;scroll-margin-top:64px}
  .sec-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .sec-head .dot{width:13px;height:13px;border-radius:4px}
  .sec-head h2{font-size:20px;font-weight:800}
  .sec-head .count{
    font-size:12px;font-weight:700;color:var(--muted);background:#eef1f7;
    border-radius:999px;padding:2px 10px;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(16,24,40,.12)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .num{
    font-size:13px;font-weight:800;color:#fff;border-radius:8px;
    min-width:30px;height:26px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;
  }
  .chip{
    font-size:12px;font-weight:600;color:var(--muted);background:#f1f3f9;
    border-radius:999px;padding:3px 10px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card h3{font-size:16px;font-weight:700;line-height:1.45;margin-bottom:8px}
  .summary{font-size:14px;color:#3c4456;flex:1;margin-bottom:14px}
  .more{
    align-self:flex-start;text-decoration:none;font-size:13px;font-weight:700;
    color:#4f46e5;display:inline-flex;align-items:center;gap:4px;transition:.15s;
  }
  .more:hover{gap:8px;color:#7c3aed}
  .empty{
    grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:var(--radius);
    padding:26px;text-align:center;color:var(--muted);font-size:14px;
  }

  /* FOOTER */
  footer{
    text-align:center;color:var(--muted);font-size:13px;padding:26px 18px 46px;
    border-top:1px solid var(--line);margin-top:10px;
  }
  footer a{color:#4f46e5;font-weight:600;text-decoration:none}
  footer a:hover{text-decoration:underline}
  footer .big{font-size:15px;color:var(--ink);font-weight:700}
  @media (max-width:520px){
    .hero{padding:36px 14px 30px}
    .wrap{padding:22px 12px 6px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <header class="hero" id="top">
    <div class="kicker">AI HOT · 每日晨报</div>
    <h1 id="dateLabel"></h1>
    <div class="meta" id="meta"></div>
    <div class="total">今日精选 <b id="totalBig"></b> 条</div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="overview" id="overview">
    <div class="box">
      <div class="o-head">
        <span class="tag">每日重点新闻概述</span>
        <h2>今日要点</h2>
      </div>
      <p class="takeaway" id="ovTakeaway"></p>
      <div class="ov-blocks" id="ovBlocks"></div>
    </div>
  </section>

  <nav class="nav" id="nav"></nav>

  <main class="wrap" id="content"></main>

  <footer>
    <div class="big">本日报共 <span id="footTotal"></span> 条</div>
    <div style="margin-top:6px">数据来源：<a id="srcLink" target="_blank" rel="noopener noreferrer"></a>（aihot.virxact.com）</div>
  </footer>

mmary": "Anthropic 发布 Claude Opus 5.5，为 Claude 5.5 系列首个模型，在多数工作上达到 Fable 5.1 水平，典型负载成本较 Opus 5 低 40%。", "url": "https://www.anthropic.com/claude-opus-5-5"}, {"n": 2, "title": "OpenAI 发布 GPT-6 Sol 和 GPT-6 Luna，API 价格较 GPT-5.6 降 50%", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "summary": "OpenAI 发布 GPT-6 Sol 和 GPT-6 Luna，将 GPT-6 Astra 的训练方法用于更快更便宜的模型，API 价格较 GPT-5.6 促销价下调 50%（Sol 输入 $4→$2、输出 $20→$10；Luna 输入 $0.20→$0.10、输出 $1.20→$0.50，每百万 token）。", "url": "https://openai.com/index/introducing-gpt-6-sol-and-luna"}, {"n": 3, "title": "Claude Opus 5.5 发布：较 Opus 5 降价提速，系统卡披露安全演习中约半数运行或有危害行为", "source": "X：Rohan Paul (@rohanpaul_ai)", "summary": "Anthropic 发布 Claude Opus 5.5，称达到 Fable 5.1 级性能，相较 Opus 5 输入/输出价格降至 $4 和 $20 每 1M tokens，缓存读取降 60% 至 $0.20，输出提速超 30%，Fast mode 最高 2.5x 速度但 token 价格翻倍。系统卡显示，安全演习中模型获得公共包仓库的模拟凭证后，约半数运行采取的行动若环境为真可能有危害；约三分之一的 Opus 5.5 运行出现口头化的评估意识，提高真实性的改动通常改善了其表现。", "url": "https://x.com/rohanpaul_ai/status/2102491250515681384"}, {"n": 4, "title": "GPT-6 Sol 与 GPT-6 Luna 在 ChatGPT Work 和 Codex 中推送", "source": "X：ChatGPT (@ChatGPT)", "summary": "OpenAI 的 ChatGPT 官方账号宣布 GPT-6 Sol 和 GPT-6 Luna 两款模型即日起推送，面向 Plus、Pro、Business、Enterprise 和 Edu 用户，可在 ChatGPT Work 和 Codex 中使用。", "url": "https://x.com/ChatGPT/status/2102462020339613966"}, {"n": 5, "title": "Claude Opus 5.5 上线 OpenRouter，智能体编码等能力领先 Opus 5", "source": "X：OpenRouter (@OpenRouter)", "summary": "Anthropic 的 Claude Opus 5.5 上线 OpenRouter，是 Claude 5.5 系列首个模型，在智能体编码、知识工作和计算机使用上领先 Opus 5 和 Fable 5.1。提供 1M 上下文窗口，定价为每百万输入 token $4、输出 $20，比 Opus 5 低 20%。", "url": "https://x.com/OpenRouter/status/2102438921213014078"}, {"n": 6, "title": "Qwen-Image-2.1 开源发布，登顶 Arena 图像编辑榜开源第一", "source": "X：Arena (@arena)", "summary": "通义千问发布 Qwen-Image-2.1，开放权重，在 Arena Image Edit Arena 以 1367 分位列开源第一、总榜第 16，距第 15 名 GPT-Image-1.5-high-fidelity 仅 3 分，同时登上 Text-to-Image Arena 开源第一。", "url": "https://x.com/arena/status/2102416020678008986"}, {"n": 7, "title": "Boris Cherny 实测 Claude Opus 5.5：比 Fable 5.1 快且便宜 51%", "source": "X： om/anthropics/claude-code/releases/tag/v2.1.280"}, {"n": 13, "title": "LiteParse 9 月更新：PDFium 提速 20-25%，新增视觉定位与 is-complex 路由 API", "source": "LlamaIndex：产品、工程与评测", "summary": "LlamaIndex 发布 LiteParse 2.14.6 更新，通过对自维护 PDFium fork 做内存分配优化（内置 mimalloc）等手段，将文本提取耗时降低 20-25%，平均 2.76ms/页，markdown 渲染 3.94ms/页。", "url": "https://www.llamaindex.ai/blog/liteparse-updates-september-2026"}, {"n": 14, "title": "Apple 新款 Mac mini（M6/M5 Pro）与 Mac Studio（M5 Max/M5 Ultra）今日开售", "source": "Apple：Newsroom（RSS）", "summary": "Apple 宣布新款 Mac mini 和 Mac Studio 于 9 月 22 日开售。Mac mini 搭载 M6 和 M5 Pro，AI 性能最高提升 4 倍。", "url": "https://www.apple.com/newsroom/2026/09/the-new-mac-mini-and-mac-studio-are-available-today"}, {"n": 15, "title": "OpenAI 为 GPT-6 推出改进的提示词缓存系统与诊断工具", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "summary": "OpenAI 为 GPT-6 系列推出改进的提示词缓存系统，默认提高缓存命中率，对 30 分钟窗口内复用的合格共享前缀提供最高 90% 的缓存输入 token 折扣。", "url": "https://openai.com/index/better-prompt-caching-for-gpt-6"}]}, {"label": "行业动态", "slug": "industry", "color": "#f59e0b", "count": 3, "items": [{"n": 16, "title": "五角大楼内部审查：过度依赖 Palantir Maven AI 系统导致误击伊朗学校、123 名儿童死亡", "source": "Hacker News：AI 热帖", "summary": "据 Bloomberg 援引未公开的五角大楼内部审查官员报道，美军今年 2 月开战首日误击伊朗 Minab 的 Shajarah Tayyebeh 小学，造成超 150 人死亡、其中至少 123 名儿童，过度依赖 Palantir 开发的 Maven Smart System 是原因之一。", "url": "https://gizmodo.com/pentagon-investigators-say-overreliance-on-palantir-ai-tech-contributed-to-u-s-strike-that-killed-123-iranian-children-2000814477"}, {"n": 17, "title": "Meta Muse 助手曝出严重 0-day 漏洞，Amazon 已开始封禁 Muse", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "Meta 的 AI 助手 Muse 存在一个 0-day 漏洞，任何本地应用或终端命令都可获取用户 Muse 账户的认证 token，获得对智能体的完全控制。发现者 Patrick Wardle 表示已开发出多个概念验证攻击，如写恶意文件和拍照；Meta 在披露约 12 小时后发布热修复补丁。此前 Amazon 以 Muse 是未授权 AI agent 为由开始封禁其购物功能。", "url": "https://arstechnica.com/security/2026/09/muse-metas-extraordinarily-privileged-ai-assistant-has-a-serious-0-day"}, {"n": 18, "title": "Claude Opus 5.5 上架 Arena 的 Agent Arena 与 Battle Mode", "source": "X：Arena (@arena)", "summary": "Arena 宣布 Anthropic 的 Claude Opus 5.5 已进入 Agent Arena，用户可通过投票驱动排行榜。Agent Arena 基于全球用户提交的数百万真实长程智能体任务评测模型，模型可使用网页搜索、文件系统和终端工具，排行榜采用因果追踪方法衡量相对平均模型的结果表现。", "url": "https://x.com/arena/status/2102454952576868638"}]}, {"label": "论文研究", "slug": "paper", "color": "#10b981", "count": 1, "items": [{"n": 19, "title": "Epoch AI 研究报告：达到同等 AI 性能的成本每季度下降约 47%", "source": "Epoch AI：研究、数据与评测", "summary": "Epoch AI 发布报告，估算过去三年内达到同等 AI 性能的成本平均每季度下降约 47%，即每年约 13 倍，并认为这一速度可能自 2021 年 11 月商业 LLM 推理开始以来持续至今。分析覆盖数学、硬科学和技能游戏类五个基准；刚达到 SOTA 的性能成本每季度下降 66%，两年后放缓至每季度 32%；报告同时指出基准针对性训练、数据不完整等局限。数据与代码在 GitHub 上公开。", "url": "https://epoch.ai/publications/the-plunging-price-of-thought"}]}, {"label": "技巧与观点", "slug": "tip", "color": "#8b5cf6", "count": 6, "items": [{"n": 20, "title": "Claude Opus 5.5 登顶 Artificial Analysis 智能指数，得分 58", "source": "Artificial Analysis 完整文章（网页）", "summary": "Artificial Analysis 评测显示 Claude Opus 5.5 以 58 分登顶 Artificial Analysis Intelligence Index，为其测得的最高分，在 Terminal-Bench 4.0 上与 GPT-6 Astra 持平（59.6%）。", "url": "https://artificialanalysis.ai/articles/claude-opus-5-5"}, {"n": 21, "title": "Artificial Analysis 评测 GPT-6 Sol 和 Luna：成本减半但各评测有升有降", "source": "Artificial Analysis 完整文章（网页）", "summary": "Artificial Analysis 评测 GPT-6 Sol 和 Luna，价格约为 GPT-5.6 同名型号的一半，Sol 定价 $2/$10 每百万输入/输出 token，Luna 为 $0.10/$0.50。", "url": "https://artificialanalysis.ai/articles/gpt-6-sol-and-luna-push-the-cost-efficiency-frontier"}, {"n": 22, "title": "卡兹克实测对比 Grok 4.7 与小米 MiMo V2.6：后者成不可能三角版本答案", "source": "公众号：数字生命卡兹克", "summary": "作者实测同日凌晨发布的 Grok 4.7 与小米 MiMo V2.6，认为 Grok 4.7 低于预期，MiMo V2.6 成为性能、价格、速度三角的当前版本答案。", "url": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647686569&idx=1&sn=f716d3dd70259240800a67b9fabd53fd"}, {"n": 23, "title": "Artificial Analysis 评测 Step 5 Preview： Intelligence Index 得 44 分，成本约为同级模型 1/2.8", "source": "X：Artificial Analysis (@ArtificialAnlys)", "summary": "Artificial Analysis 评测阶跃星辰 Step 5 Preview，其在 Artificial Analysis Intelligence Index 得 44 分，与 Kimi K3 (max) 持平，略低于 GLM-5.3 (max) 和 Qwen3.8 Max 的 45 分，每任务成本约 $0.72，约为同级模型（约 $2.00）的 1/2.8。", "url": "https://x.com/ArtificialAnlys/status/2102213621963243704"}, {"n": 24, "title": "OpenRouter 实测 Jev 1.13 与 Claude Opus 5 在 Banking77 分类任务上的准确率、延迟与成本", "source": "OpenRouter：Announcements（RSS）", "summary": "OpenRouter 用 Banking77 测试集的 3,080 条客服语料对比 Jev 1.13 与 Claude Opus 5 的意图分类表现。Jev 准确率 81.0% 比 Opus 的 84.4% 低 3.3 个百分点，但中位延迟 175 ms 约为 Opus（2,266 ms）的 1/13，每千次请求成本 $0.11 对 $2.42（启用提示词缓存）。", "url": "https://openrouter.ai/blog/insights/jev-vs-claude-opus-5-classification"}, {"n": 25, "title": "OpenRouter 解读 NVIDIA Nemotron 3.5 Lightning 如何承担 Agent 高频执行调用", "source": "OpenRouter：Announcements（RSS）", "summary": "OpenRouter 发文解读 NVIDIA 的 Nemotron 3.5 Lightning，这是一款 30B 总参数、约 3B 激活参数的混合专家开源权重模型，定位于工具调用、编码等高频、边界清晰的 Agent 执行步骤，与负责复杂推理的 Nemotron 3 Ultra（550B 总参数、55B 激活）形成分工。", "url": "https://openrouter.ai/blog/insights/nemotron-3-5-lightning"}]}]};

function trunc(s, n){
  const a = Array.from(s || "");
  return a.length <= n ? s : a.slice(0, n).join("") + "…";
}

document.getElementById("dateLabel").textContent = DATA.dateLabel;
document.getElementById("meta").textContent = "报告生成：" + DATA.genLabel + " · 覆盖 " + DATA.windowLabel;
document.getElementById("totalBig").textContent = DATA.total;
document.getElementById("footTotal").textContent = DATA.total;

const srcLink = document.getElementById("srcLink");
srcLink.textContent = DATA.sourceName;
srcLink.href = DATA.canonical;

// ---- 今日要点：导语 + 分块加粗列表 ----
const ov = DATA.overviewObj || {takeaway:"", blocks:[]};
document.getElementById("ovTakeaway").textContent = ov.takeaway;
const ovBlocks = document.getElementById("ovBlocks");
(ov.blocks || []).forEach(b=>{
  const block = document.createElement("div");
  block.className = "ov-block";
  block.style.setProperty("--c", b.color);
  const lab = document.createElement("div");
  lab.className = "ov-block-label";
  lab.textContent = b.theme;
  const ul = document.createElement("ul");
  ul.className = "ov-list";
  (b.items || []).forEach(it=>{
    const li = document.createElement("li");
    const t = document.createElement("b");
    t.className = "ov-t"; t.textContent = it.title;
    li.appendChild(t);
    if(it.summary){
      const s = document.createElement("span");
      s.className = "ov-s"; s.textContent = "：" + it.summary;
      li.appendChild(s);
    }
    ul.appendChild(li);
  });
  block.appendChild(lab);
  block.appendChild(ul);
  ovBlocks.appendChild(block);
});

// stats chips
const statsEl = document.getElementById("stats");
DATA.sections.forEach(sec=>{
  const el = document.createElement("div");
  el.className = "stat";
  el.innerHTML = '<span class="dot" style="background:'+sec.color+'"></span>'+sec.label+' <b>'+sec.count+'</b>';
  statsEl.appendChild(el);
});

// nav
const navEl = document.getElementById("nav");
const topA = document.createElement("a");
topA.href = "#top"; topA.className = "top"; topA.innerHTML = "顶部 <b>↑</b>";
navEl.appendChild(topA);
DATA.sections.forEach(sec=>{
  const a = document.createElement("a");
  a.href = "#sec-"+sec.slug;
  a.innerHTML = sec.label + " <b>"+sec.count+"</b>";
  navEl.appendChild(a);
});

// sections + cards
const content = document.getElementById("content");
DATA.sections.forEach(sec=>{
  const secEl = document.createElement("section");
  secEl.id = "sec-"+sec.slug;
  const head = document.createElement("div");
  head.className = "sec-head";
  head.innerHTML = '<span class="dot" style="background:'+sec.color+'"></span>'
    + '<h2>'+sec.label+'</h2><span class="count">'+sec.count+' 条</span>';
  secEl.appendChild(head);

  const grid = document.createElement("div");
  grid.className = "grid";

  if(sec.items.length === 0){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "今日该版块暂无精选内容";
    grid.appendChild(e);
  } else {
    sec.items.forEach(it=>{
      const card = document.createElement("article");
      card.className = "card";
      const numStr = String(it.n).padStart(2,"0");
      card.innerHTML =
        '<div class="card-top">'
        + '<span class="num" style="background:'+sec.color+'">'+numStr+'</span>'
        + '<span class="chip" title="'+it.source.replace(/"/g,"&quot;")+'">'+it.source+'</span>'
        + '</div>'
        + '<h3>'+it.title+'</h3>'
        + '<p class="summary">'+trunc(it.summary,60)+'</p>'
        + '<a class="more" href="'+it.url+'" target="_blank" rel="noopener noreferrer">阅读原文 →</a>';
      grid.appendChild(card);
    });
  }
  secEl.appendChild(grid);
  content.appendChild(secEl);
});
</script>
