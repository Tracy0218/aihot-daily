<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT 每日晨报</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2533; --muted:#6b7280;
    --line:#e7eaf2; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* HERO */
  .hero{
    background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#9333ea 100%);
    color:#fff; padding:46px 22px 38px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::after{content:"";position:absolute;inset:0;background:
    radial-gradient(600px 200px at 15% -10%,rgba(255,255,255,.18),transparent),
    radial-gradient(500px 220px at 90% 0%,rgba(255,255,255,.12),transparent);pointer-events:none}
  .kicker{font-size:13px;letter-spacing:.28em;text-transform:uppercase;opacity:.85;font-weight:600}
  .hero h1{font-size:clamp(26px,5vw,40px);margin:10px 0 6px;font-weight:800;letter-spacing:.5px}
  .hero .meta{font-size:13px;opacity:.9;max-width:680px;margin:0 auto}
  .hero .total{margin:18px 0 22px;font-size:15px}
  .hero .total b{font-size:30px;font-weight:800;vertical-align:-2px;margin:0 6px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:760px;margin:0 auto}
  .stat{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(6px);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:7px;
  }
  .stat .dot{width:9px;height:9px;border-radius:50%}
  .stat b{font-size:15px}

  /* OVERVIEW (今日要点) */
  .overview{max-width:1080px;margin:22px auto 0;padding:0 18px}
  .overview .box{
    background:linear-gradient(180deg,#ffffff,#fbfcff);
    border:1px solid var(--line);border-left:4px solid #7c3aed;
    border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);
  }
  .overview .o-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .overview .o-head .tag{
    font-size:11px;font-weight:700;color:#7c3aed;background:#f1ecfe;
    border-radius:6px;padding:2px 9px;letter-spacing:.04em;
  }
  .overview .o-head h2{font-size:16px;font-weight:800;color:var(--ink)}
  .overview p{font-size:14.5px;color:#374151;line-height:1.78}
  /* 第二个块：智能客服的新机会（不同强调色，便于一眼区分） */
  .overview .box.cs{border-left-color:#0d948b}
  .overview .o-head .tag.cs{color:#0d948b;background:#e6f7f4}
  #csText{white-space:pre-line}
  @media (max-width:520px){ .overview{padding:0 12px} }

  /* NAV */
  .nav{
    position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 14px;
  }
  .nav a{
    text-decoration:none;font-size:13px;color:var(--ink);font-weight:600;
    padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;transition:.15s;
    border:1px solid transparent;
  }
  .nav a:hover{background:#eef1fb;border-color:#d9defb}
  .nav a.top{background:#1f2533;color:#fff}
  .nav a b{font-size:12px;background:rgba(0,0,0,.07);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
  .nav a.top b{background:rgba(255,255,255,.25)}

  /* SECTIONS */
  .wrap{max-width:1080px;margin:0 auto;padding:30px 18px 10px}
  section{margin-bottom:38px;scroll-margin-top:64px}
  .sec-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .sec-head .dot{width:13px;height:13px;border-radius:4px}
  .sec-head h2{font-size:20px;font-weight:800}
  .sec-head .count{
    font-size:12px;font-weight:700;color:var(--muted);background:#eef1f7;
    border-radius:999px;padding:2px 10px;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(16,24,40,.12)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .num{
    font-size:13px;font-weight:800;color:#fff;border-radius:8px;
    min-width:30px;height:26px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;
  }
  .chip{
    font-size:12px;font-weight:600;color:var(--muted);background:#f1f3f9;
    border-radius:999px;padding:3px 10px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card h3{font-size:16px;font-weight:700;line-height:1.45;margin-bottom:8px}
  .summary{font-size:14px;color:#3c4456;flex:1;margin-bottom:14px}
  .more{
    align-self:flex-start;text-decoration:none;font-size:13px;font-weight:700;
    color:#4f46e5;display:inline-flex;align-items:center;gap:4px;transition:.15s;
  }
  .more:hover{gap:8px;color:#7c3aed}
  .empty{
    grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:var(--radius);
    padding:26px;text-align:center;color:var(--muted);font-size:14px;
  }

  /* FOOTER */
  footer{
    text-align:center;color:var(--muted);font-size:13px;padding:26px 18px 46px;
    border-top:1px solid var(--line);margin-top:10px;
  }
  footer a{color:#4f46e5;font-weight:600;text-decoration:none}
  footer a:hover{text-decoration:underline}
  footer .big{font-size:15px;color:var(--ink);font-weight:700}
  @media (max-width:520px){
    .hero{padding:36px 14px 30px}
    .wrap{padding:22px 12px 6px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <header class="hero" id="top">
    <div class="kicker">AI HOT · 每日晨报</div>
    <h1 id="dateLabel"></h1>
    <div class="meta" id="meta"></div>
    <div class="total">今日精选 <b id="totalBig"></b> 条</div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="overview" id="overview">
    <div class="box">
      <div class="o-head">
        <span class="tag">每日重点新闻概述</span>
        <h2>今日要点</h2>
      </div>
      <p id="overviewText"></p>
    </div>
    <div class="box cs" style="margin-top:14px">
      <div class="o-head">
        <span class="tag cs">智能客服 · 新机会</span>
        <h2>智能客服的新机会和创新应用</h2>
      </div>
      <p id="csText"></p>
    </div>
  </section>

  <nav class="nav" id="nav"></nav>

  <main class="wrap" id="content"></main>

  <footer>
    <div class="big">本日报共 <span id="footTotal"></span> 条</div>
    <div style="margin-top:6px">数据来源：<a id="srcLink" target="_blank" rel="noopener noreferrer"></a>（aihot.virxact.com）</div>
  </footer>

<script>
const DATA = {"dateLabel": "2026年8月12日 星期三", "genLabel": "2026年8月12日 08:00（北京时间）", "windowLabel": "8月11日 08:00 – 8月12日 08:00（北京时间）", "total": 26, "overview": "今日 AI 圈值得关注的重点：模型层面，NVIDIA 发布 Nemotron 3.5 Lightning，一款可定制的开源 30B 混合专家（MoE）模型，专为常驻智能体设计。相比同类开源模型，其 token 生成速度最高提升 4 倍，任务完成时间缩短 30%。该模型采用开放权重，支持用户微调以匹配特定任务，并可在 RTX PC、DGX Spark 及 Jetson 等设备上运行。产品侧，完整阵容，完整曲目，一次生成一个。 Seedance 2.5 已在 Runway 上线，支持 50 个独特角色参考，以及最长 30 秒、与音乐同步的片段。点击下方链接即可开始使用。行业方面，Alexander Panfilov团队发现OpenAI、Anthropic、Google等主要AI提供商API存在漏洞，可读取推理模型的加密思考过程。扫描约7000条公开会话发现62个API密钥、33个邮箱和33个密码。通过越狱，Anthropic的Haiku 4.5可逐字转写Opus 4.8的原始推理；解码10000条推理轨迹的API成本约720美元。另外，研究团队为 macOS 虚拟机中的 Metal 能力查询构建进程级兼容层，使 llama.cpp 能选用更新的 Metal 内核。在 M1 Ultra 上，TinyLlama 1.1B 的提示处理速度提升 11.08 倍、token 生成提升 16.36 倍，接近裸机性能的 98%；Gemma 4 12B 的提示处理与生成速度分别提升 7.20 倍和 14.54 倍。另外，OpenAI 宣布其未发布的 Astra 模型解决了 10 道长期悬而未决的数学难题，涵盖球体堆积、纠错码、非 sofic 群存在性等领域，并发布超 250 页论文及 Lean 验证结果。", "csInsight": "结合今日的模型与产品动态，以下方向为智能客服带来新的落地机会：\n· 全渠道与多终端覆盖（源自模型动态「SGLang 宣布 Day-0 支持 NVIDIA Nemotron 3.5 Lightning」）：借助开放平台对手机、PC、智能眼镜等终端的接入能力，客服可延伸到用户所在的任意设备与场景，实现随身式服务。\n· 私有化与数据合规（源自模型动态「NVIDIA 推出 Nemotron 3.5 Lightning，加速本地智能体任务」）：开放权重/本地常驻的模型可在企业内网部署，客户对话与工单数据不出域，满足金融、政务等强合规场景的部署要求。\n· 自主任务执行（源自产品动态「ChatGPT 桌面端支持导入其他智能体工作数据」）：模型对智能体与自动化的优化，使客服从『问答』走向『代办』，可自主查询订单、发起退款、更新工单并回执处理进展。\n· 规模化降本（源自模型动态「Ling-3.0-tiny 正式开源：1.3B 激活参数如何进入真实任务」）：底层推理与算力基础设施的持续投入拉低单位调用成本，让 7x24 全量智能客服在大规模用户下仍具经济性。", "sourceName": "AIHOT", "canonical": "https://aihot.virxact.com/daily/2026-08-12", "sections": [{"label": "模型发布/更新", "slug": "ai-models", "color": "#2563eb", "count": 3, "items": [{"n": 1, "title": "NVIDIA 推出 Nemotron 3.5 Lightning，加速本地智能体任务", "source": "NVIDIA Blog（RSS）", "summary": "NVIDIA 发布 Nemotron 3.5 Lightning，一款可定制的开源 30B 混合专家（MoE）模型，专为常驻智能体设计。相比同类开源模型，其 token 生成速度最高提升 4 倍，任务完成时间缩短 30%。该模型采用开放权重，支持用户微调以匹配特定任务，并可在 RTX PC、DGX Spark 及 Jetson 等设备上运行。", "url": "https://blogs.nvidia.com/blog/local-ai-open-source-models-agents-nemotron"}, {"n": 2, "title": "SGLang 宣布 Day-0 支持 NVIDIA Nemotron 3.5 Lightning", "source": "LMSYS：Blog（Chatbot Arena 团队）", "summary": "SGLang 宣布对 NVIDIA Nemotron 3.5 Lightning 提供 Day-0 支持，该开源模型为 30B 总参数、3B 激活参数的混合专家架构，支持最长 1M token 上下文，可从 Hugging Face 下载 BF16 和 NVFP4 权重。模型支持 MTP、DFlash、DSpark 三种投机解码技术，并可通过 OpenAI 兼容 API 接入智能体工作流。", "url": "https://www.lmsys.org/blog/2026-08-11-nemotron-3-5-lightning"}, {"n": 3, "title": "Ling-3.0-tiny 正式开源：1.3B 激活参数如何进入真实任务", "source": "公众号：蚂蚁百灵（Ling）", "summary": "蚂蚁百灵开源 Ling-3.0-tiny，一款总参数 7.9B、推理时仅激活 1.3B 参数的原生混合推理模型，同步提供 BF16、FP8 和 INT4 三个版本。", "url": "https://mp.weixin.qq.com/s?__biz=MzkyODk2MDQwNw%3D%3D&mid=2247487491&idx=1&sn=fcb14aceb054f9a24e22525d3dae6fa0"}]}, {"label": "产品发布/更新", "slug": "ai-products", "color": "#0ea5e9", "count": 5, "items": [{"n": 4, "title": "Runway Seedance 2.5 上线，支持50角色参考", "source": "X：Runway (@runwayml)", "summary": "完整阵容，完整曲目，一次生成一个。 Seedance 2.5 已在 Runway 上线，支持 50 个独特角色参考，以及最长 30 秒、与音乐同步的片段。点击下方链接即可开始使用。", "url": "https://x.com/runwayml/status/2087251184658657346"}, {"n": 5, "title": "Gemini 助力 Database Migration Service 加速 PostgreSQL 迁移", "source": "Google Cloud：Databases（RSS）", "summary": "Google Cloud 在 Database Migration Service（DMS）中推出由 Gemini 驱动的 AI 辅助代码转换，可将 Oracle 或 SQL Server 的存储过程、触发器和自定义函数转换为 PostgreSQL PL/pgSQL 代码。", "url": "https://cloud.google.com/blog/products/databases/accelerate-postgresql-migrations-with-gemini-in-dms"}, {"n": 6, "title": "ZCode全面升级：Goal、Subagents、Remote Control与闲时任务四大功能上线", "source": "公众号：智谱（GLM）", "summary": "ZCode针对GLM深度优化，今日上线Goal、Subagents、Remote Control与闲时任务四大功能。在Z.ai Code Bench测试中，GLM-5.2搭配ZCode较搭配Claude Code任务整体通过率高2.39%；ZCode缓存命中率超98%，叠加1.5倍限时额度加成后，GLM Coding Plan整体使用量接近常规额度的1.8倍。", "url": "https://mp.weixin.qq.com/s?__biz=MzkyMzI3NzQ0Mg%3D%3D&mid=2247494052&idx=1&sn=ee3ab3d0f4550e9120927c53a27522c9"}, {"n": 7, "title": "ChatGPT 桌面端支持导入其他智能体工作数据", "source": "X：OpenAI Developers (@OpenAIDevs)", "summary": "你现在可以将其他智能体的工作内容与 ChatGPT Work 和 Codex 保持同步。 可导入项目、聊天记录、技能和插件，查看导入历史，并可在设置中选择开启自动更新。 现已在 ChatGPT 桌面应用中提供。", "url": "https://x.com/OpenAIDevs/status/2087242829076791392"}, {"n": 8, "title": "Databricks 开源 Metals v2：面向数百万行代码库的 Java 和 Scala 语言服务器", "source": "Databricks：Blog（RSS）", "summary": "Databricks 开源 Metals v2，这是其面向数百万行代码库的 Java 和 Scala 语言服务器。Metals v2 专为智能体驱动的开发场景设计，旨在提升大规模代码库中的编辑与导航性能。目前 Databricks 的大部分代码已由智能体编写，该工具服务于工程师仍需要手动介入的环节。", "url": "https://www.databricks.com/blog/open-sourcing-metals-v2-databricks-java-and-scala-language-server-multi-million-line-codebases"}]}, {"label": "行业动态", "slug": "industry", "color": "#f59e0b", "count": 7, "items": [{"n": 9, "title": "研究人员发现可读取ChatGPT等模型加密推理过程的API漏洞", "source": "The Decoder：AI News（RSS）", "summary": "Alexander Panfilov团队发现OpenAI、Anthropic、Google等主要AI提供商API存在漏洞，可读取推理模型的加密思考过程。扫描约7000条公开会话发现62个API密钥、33个邮箱和33个密码。通过越狱，Anthropic的Haiku 4.5可逐字转写Opus 4.8的原始推理；解码10000条推理轨迹的API成本约720美元。", "url": "https://the-decoder.com/but-marinade-and-leaked-passwords-are-what-researchers-found-in-chatgpts-hidden-reasoning"}, {"n": 10, "title": "消息称 Anthropic 最快今年 9 月上市，向投资者淡化 AI 模型竞争等挑战", "source": "IT之家（RSS）", "summary": "Anthropic 正与潜在投资者接触，为可能成为史上规模最大的 IPO 做准备，计划今年 9 月或 10 月初正式上市。公司估值高达 9,650 亿美元，年化收入已超 470 亿美元，并淡化来自中国 AI 企业的竞争影响。Anthropic 还计划拓展 AI 在医疗和生物学领域的应用，但尚未公布具体 IPO 定价方案。", "url": "https://www.ithome.com/0/988/239.htm"}, {"n": 11, "title": "Gemini月活破10亿，成谷歌增长最快产品", "source": "X：Sundar Pichai (@sundarpichai)", "summary": "每月已有超过 10 亿人使用 @Geminiapp 激发新想法、完成工作。这是我们有史以来增长最快的产品，也是第 14 个达到 10 亿用户里程碑的产品。 感谢 @JoshWoodward 和整个 Gemini 团队，也感谢每一位与我们同行的伙伴——未来还有更多精彩！", "url": "https://x.com/sundarpichai/status/2087222656819241292"}, {"n": 12, "title": "消息称英伟达开发万亿参数开源 AI 模型 Nemotron 4，目标挑战全球顶级", "source": "IT之家（RSS）", "summary": "英伟达正在研发新一代开源 AI 模型系列 Nemotron 4，规模最大的模型预计至少拥有 1 万亿个参数，旨在与全球最先进的开源模型竞争。英伟达尚未确定发布日期，最终训练也未完成，员工认为该模型最早可能在今年秋末准备就绪。此举意在通过开放模型生态扩大 AI 应用范围，并推动市场对其 GPU 算力的需求。", "url": "https://www.ithome.com/0/988/524.htm"}, {"n": 13, "title": "NVIDIA 为何需要新供电架构以扩展 AI 算力性能", "source": "NVIDIA Blog（RSS）", "summary": "NVIDIA 主张以 800 VDC 直流配电替代传统交流多次转换，以降低损耗、支撑 AI 算力扩展。NVIDIA 与 Google、Microsoft 通过 OCP 联合制定该架构，已发布白皮书及 LVDC 固态变压器规范 v0.3，超 80 家设备商正据此开发产品。", "url": "https://blogs.nvidia.com/blog/800-vdc-power-architecture-ai-factory"}, {"n": 14, "title": "英伟达循环融资达到新高度，黄仁勋是否过度出牌？", "source": "Gary Marcus：The Road to AI We Can Trust（RSS）", "summary": "英伟达股价在相关消息公布后小幅下滑，收盘报217.55美元，盘前略有回升。金融记者Holger Zschaepitz和曾预测安然倒闭的Jim Chanos均对英伟达的循环融资做法表示担忧。此外，英伟达将发布真正开源（非仅开放权重）的Nemotron模型新版本，这可能最终削弱其合作伙伴OpenAI和Anthropic的地位。", "url": "https://garymarcus.substack.com/p/breaking-circular-financing-reaches"}, {"n": 15, "title": "Electric 加入 Databricks，将 WASM Postgres 引入 AI 智能体沙箱", "source": "Databricks：Blog（RSS）", "summary": "Databricks 宣布 Electric 团队加入，将 WASM Postgres 引入 AI 智能体沙箱。该技术让智能体在隔离环境中运行本地数据库，支持实时数据同步与离线操作，提升构建可靠、可验证智能体应用的效率。Electric 的加入将强化 Databricks 在智能体基础设施领域的布局。", "url": "https://www.databricks.com/blog/electric-joins-databricks-bring-wasm-postgres-ai-agent-sandboxes"}]}, {"label": "论文研究", "slug": "paper", "color": "#10b981", "count": 3, "items": [{"n": 16, "title": "Apple Silicon 与 macOS 虚拟机：借助 Llama.cpp 实现 11–16 倍的 LLM 推理加速", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "研究团队为 macOS 虚拟机中的 Metal 能力查询构建进程级兼容层，使 llama.cpp 能选用更新的 Metal 内核。在 M1 Ultra 上，TinyLlama 1.1B 的提示处理速度提升 11.08 倍、token 生成提升 16.36 倍，接近裸机性能的 98%；Gemma 4 12B 的提示处理与生成速度分别提升 7.20 倍和 14.54 倍。", "url": "https://github.com/trycua/cua/blob/main/blog/gpu-passthrough-macos-vms.md"}, {"n": 17, "title": "统一 Radix 缓存：为混合模型前缀缓存构建单一树结构", "source": "LMSYS：Blog（Chatbot Arena 团队）", "summary": "LMSYS 团队提出 Unified Radix Cache，用单一 token 键控 radix 拓扑统一管理混合模型的 FULL、SWA 和 MAMBA 组件缓存，各组件独立执行路径、滑动窗口和检查点复用语义。", "url": "https://www.lmsys.org/blog/2026-08-11-unified-radix-cache"}, {"n": 18, "title": "AMIE 研究医疗 AI 系统首次展示实时临床视频问诊能力", "source": "Google Blog：AI（RSS）", "summary": "Google Research 与 Google DeepMind 推进医疗 AI 系统 AMIE，实现实时临床视频问诊，首次在此场景展示专家级 AI 能力。该系统基于 Gemini 和 Project Astra 构建，可解读视觉与听觉线索、引导虚拟体格检查并实时诊断推理。随机研究中，临床评估者对 AMIE 的病史采集、诊断准确性等核心能力给予好评，患者演员也更偏好视频体验。", "url": "https://blog.google/innovation-and-ai/models-and-research/google-research/amie-video-consultations"}]}, {"label": "技巧与观点", "slug": "tip", "color": "#8b5cf6", "count": 8, "items": [{"n": 19, "title": "OpenAI 用 Astra 模型攻克 10 道数学难题，数学家既兴奋又担忧", "source": "The Verge：AI（RSS）", "summary": "OpenAI 宣布其未发布的 Astra 模型解决了 10 道长期悬而未决的数学难题，涵盖球体堆积、纠错码、非 sofic 群存在性等领域，并发布超 250 页论文及 Lean 验证结果。", "url": "https://www.theverge.com/ai-artificial-intelligence/977273/the-ai-takeover-of-mathematics-has-begun"}, {"n": 20, "title": "用 ComfyUI API 实现 MiniMax-H3 多模态视频与音频生成流水线", "source": "MarkTechPost（RSS）", "summary": "本教程演示如何以 ComfyUI 为无头推理后端，构建端到端的 MiniMax-H3 视频生成工作流。通过 Python 直接构建执行图，支持文生视频、首尾帧条件生成和参考图像条件生成，并自动根据 GPU 显存选择 quality、balanced、squeeze 三种权重配置。流水线涵盖模型自动下载、节点模式校验、音视频联合解码与进度监控，无需图形界面即可复现实验。", "url": "https://www.marktechpost.com/2026/08/10/implementing-a-minimax-h3-multimodal-video-and-audio-generation-pipeline-with-comfyui-apis"}, {"n": 21, "title": "将 GitHub Copilot 置于中间人（MitM）代理之后后，我学到了什么", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "作者通过 mitmproxy 对 VS Code 中的 GitHub Copilot 进行中间人代理拦截，逆向分析其网络流量与内部架构。文章指出这些 AI 应用普遍基于 Electron 构建，共享相似的网络栈，因此探测结果可迁移至其他同类应用。作者借此揭示了 Copilot 的运行时行为，并分享了配置代理的具体步骤。", "url": "https://www.lighthousenewsletter.com/p/i-put-github-copilot-behind-a-mitm"}, {"n": 22, "title": "编写智能体时，哪种编程语言最合适？", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "针对“动态语言比静态语言更省 LLM token”的流行说法，作者用 GPT-5.6 Sol 让智能体实现 zstd 解码器进行实测。结果显示，medium 努力度下动态语言表现更好，ultra 下静态语言反而更优，且此前评测存在测试路径错误等缺陷。作者认为，琐碎任务上的性能无法推广到更大问题。", "url": "http://danluu.com/pl-tokens"}, {"n": 23, "title": "微信小微AI帮写与AI点评内测：朋友圈最后一点人味正在消失", "source": "公众号：数字生命卡兹克", "summary": "微信基于小微推出朋友圈AI帮写与AI点评内测功能，前者可根据图片和已写文字生成3条朋友圈文案，后者可长按文字生成评价或快捷评论。作者认为这两个功能将AI置于社交核心位置，可能鼓励AI内容、破坏朋友圈自2012年确立的“记录美好生活”基调。公众号端小微还常驻首位，自动总结常看公众号文章，作者担忧这会反向影响创作者内容生产。", "url": "https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&mid=2647685081&idx=1&sn=13a05578a3959c047209c8e74b56fa48"}, {"n": 24, "title": "Ryan Greenblatt：人类级AI或于2032年前通过递归自我改进催生失控超级智能", "source": "Dwarkesh Patel：Podcast & Blog（RSS）", "summary": "Dwarkesh Patel与Redwood Research首席科学家Ryan Greenblatt探讨递归自我改进（RSI）的可能性：一旦AI达到人类顶级专家水平，可能在一年内实现相当于4-5年的AI进展，Ryan的中位预期是2031年自动化AI研发。双方还讨论了超级智能的对齐对象、奖励黑客行为是否会升级为AI联手接管世界等风险。", "url": "https://www.dwarkesh.com/p/ryan-greenblatt"}, {"n": 25, "title": "每个类别都有赢家：AI 时代 SaaS 龙头的估值溢价", "source": "Tomer Tunguz 博客（VC 分析）", "summary": "SaaS 估值整体承压，但每个细分赛道都跑出了 AI 龙头：CrowdStrike 以 34.4x 前瞻收入领跑安全（中位数 3.9x），Cloudflare 32.6x 对 17.5x，Shopify 11.3x 对 1.4x。", "url": "https://www.tomtunguz.com/a-winner-in-every-category"}, {"n": 26, "title": "Can you trust what AI tells you?", "source": "Claude：YouTube（RSS）", "summary": "", "url": "https://www.youtube.com/watch?v=cIMlBw2nqfA"}]}]};

function trunc(s, n){
  const a = Array.from(s || "");
  return a.length <= n ? s : a.slice(0, n).join("") + "…";
}

document.getElementById("dateLabel").textContent = DATA.dateLabel;
document.getElementById("meta").textContent = "报告生成：" + DATA.genLabel + " · 覆盖 " + DATA.windowLabel;
document.getElementById("totalBig").textContent = DATA.total;
document.getElementById("footTotal").textContent = DATA.total;

const srcLink = document.getElementById("srcLink");
srcLink.textContent = DATA.sourceName;
srcLink.href = DATA.canonical;

document.getElementById("overviewText").textContent = DATA.overview;
document.getElementById("csText").textContent = DATA.csInsight;

// stats chips
const statsEl = document.getElementById("stats");
DATA.sections.forEach(sec=>{
  const el = document.createElement("div");
  el.className = "stat";
  el.innerHTML = '<span class="dot" style="background:'+sec.color+'"></span>'+sec.label+' <b>'+sec.count+'</b>';
  statsEl.appendChild(el);
});

// nav
const navEl = document.getElementById("nav");
const topA = document.createElement("a");
topA.href = "#top"; topA.className = "top"; topA.innerHTML = "顶部 <b>↑</b>";
navEl.appendChild(topA);
DATA.sections.forEach(sec=>{
  const a = document.createElement("a");
  a.href = "#sec-"+sec.slug;
  a.innerHTML = sec.label + " <b>"+sec.count+"</b>";
  navEl.appendChild(a);
});

// sections + cards
const content = document.getElementById("content");
DATA.sections.forEach(sec=>{
  const secEl = document.createElement("section");
  secEl.id = "sec-"+sec.slug;
  const head = document.createElement("div");
  head.className = "sec-head";
  head.innerHTML = '<span class="dot" style="background:'+sec.color+'"></span>'
    + '<h2>'+sec.label+'</h2><span class="count">'+sec.count+' 条</span>';
  secEl.appendChild(head);

  const grid = document.createElement("div");
  grid.className = "grid";

  if(sec.items.length === 0){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "今日该版块暂无精选内容";
    grid.appendChild(e);
  } else {
    sec.items.forEach(it=>{
      const card = document.createElement("article");
      card.className = "card";
      const numStr = String(it.n).padStart(2,"0");
      card.innerHTML =
        '<div class="card-top">'
        + '<span class="num" style="background:'+sec.color+'">'+numStr+'</span>'
        + '<span class="chip" title="'+it.source.replace(/"/g,"&quot;")+'">'+it.source+'</span>'
        + '</div>'
        + '<h3>'+it.title+'</h3>'
        + '<p class="summary">'+trunc(it.summary,60)+'</p>'
        + '<a class="more" href="'+it.url+'" target="_blank" rel="noopener noreferrer">阅读原文 →</a>';
      grid.appendChild(card);
    });
  }
  secEl.appendChild(grid);
  content.appendChild(secEl);
});
</script>
